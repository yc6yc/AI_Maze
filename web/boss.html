<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boss Battle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="boss-page">
    <section class="battlefield">
      <canvas id="bossCanvas"></canvas>
      <div id="playerActor" class="actor player-actor"></div>
      <div id="bossActor" class="actor boss-actor"></div>
      <div id="damageText" class="damage-text"></div>
      <div class="battle-hud">
        <span id="battlePhase">ready</span>
        <strong id="bossHp">0</strong>
      </div>
      <ol id="battleLog" class="battle-log"></ol>
    </section>
    <script src="boss.js"></script>
  </body>
</html>
