<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Maze 可视化面板</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="intro-active">
    <section id="introScreen" class="intro-screen" aria-label="开始界面">
      <div class="intro-backdrop" aria-hidden="true">
        <div class="intro-grid-lines"></div>
        <div class="scanline"></div>
      </div>

      <div class="intro-content">
        <div class="intro-copy">
          <p class="eyebrow">AI Maze Arena</p>
          <h1>进入迷宫挑战</h1>
          <p class="intro-tagline">收集金币，避开陷阱，击败 Boss，冲向出口。</p>

          <div class="intro-stats" aria-label="地图概览">
            <div>
              <span>地图</span>
              <strong id="introSize">--</strong>
            </div>
            <div>
              <span>路径</span>
              <strong id="introRoute">--</strong>
            </div>
            <div>
              <span>Boss</span>
              <strong id="introBoss">--</strong>
            </div>
          </div>

          <button id="startGameBtn" class="start-btn" type="button">
            <span>开始探索</span>
            <span class="start-mark">›</span>
          </button>
        </div>

        <div class="intro-visual" aria-hidden="true">
          <div class="intro-device">
            <div class="device-top">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div id="introMiniMap" class="intro-mini-map"></div>
            <img class="intro-player" src="../viz/assets/player.png" alt="" />
            <img class="intro-boss" src="../viz/assets/boss.png" alt="" />
            <img class="intro-coin coin-a" src="../viz/assets/coin.png" alt="" />
            <img class="intro-coin coin-b" src="../viz/assets/coin.png" alt="" />
          </div>
          <div id="introMeta" class="intro-meta">正在装载地图...</div>
        </div>
      </div>
    </section>

    <main class="app-shell">
      <aside class="panel control-panel" aria-label="迷宫控制台">
        <div class="brand-block">
          <p class="eyebrow">AI Maze Visualizer</p>
          <h1>迷宫智能体回放</h1>
          <div class="status-row">
            <span id="mapName" class="status-pill">maze_15_15.json</span>
            <span id="runState" class="status-pill accent">待机</span>
          </div>
        </div>

        <section class="metrics-grid" aria-label="运行指标">
          <div class="metric-tile">
            <span>回合</span>
            <strong id="metricRound">0</strong>
          </div>
          <div class="metric-tile">
            <span>金币</span>
            <strong id="metricCoins">0</strong>
          </div>
          <div class="metric-tile">
            <span>探索</span>
            <strong id="metricExplored">0%</strong>
          </div>
          <div class="metric-tile">
            <span>路径</span>
            <strong id="metricRoute">0</strong>
          </div>
        </section>

        <section class="tool-section" aria-label="播放控制">
          <div class="section-title">播放</div>
          <div class="button-row">
            <button id="resetBtn" type="button" class="icon-btn" aria-label="重置">↺</button>
            <button id="prevBtn" type="button" class="icon-btn" aria-label="上一帧">‹</button>
            <button id="playBtn" type="button" class="primary-btn" aria-label="播放或暂停">▶</button>
            <button id="nextBtn" type="button" class="icon-btn" aria-label="下一帧">›</button>
          </div>
          <label class="range-field">
            <span>进度</span>
            <input id="timeline" type="range" min="0" max="0" value="0" />
          </label>
          <label class="range-field">
            <span>速度</span>
            <input id="speedRange" type="range" min="1" max="12" value="5" />
            <output id="speedLabel">5x</output>
          </label>
        </section>

        <section class="tool-section" aria-label="视图模式">
          <div class="section-title">视图</div>
          <div class="segmented-control" role="tablist" aria-label="显示模式">
            <button type="button" class="segment active" data-mode="live">实况</button>
            <button type="button" class="segment" data-mode="full">全图</button>
            <button type="button" class="segment" data-mode="risk">风险</button>
            <button type="button" class="segment" data-mode="reward">收益</button>
          </div>

          <div class="toggle-grid">
            <label class="toggle-field">
              <input id="toggleFog" type="checkbox" checked />
              <span>迷雾</span>
            </label>
            <label class="toggle-field">
              <input id="togglePath" type="checkbox" checked />
              <span>路径</span>
            </label>
            <label class="toggle-field">
              <input id="toggleHeat" type="checkbox" />
              <span>热力</span>
            </label>
            <label class="toggle-field">
              <input id="toggleSprites" type="checkbox" checked />
              <span>贴图</span>
            </label>
          </div>
        </section>

        <section class="tool-section" aria-label="地图文件">
          <div class="section-title">地图</div>
          <div class="button-row">
            <button id="loadDefaultBtn" type="button" class="secondary-btn">默认地图</button>
            <label class="file-btn">
              导入 JSON
              <input id="fileInput" type="file" accept="application/json,.json" />
            </label>
          </div>
          <p id="mapMeta" class="meta-text">正在加载地图数据...</p>
        </section>
      </aside>

      <section class="stage-panel" aria-label="迷宫画布">
        <div class="stage-topbar">
          <div>
            <p class="eyebrow">Canvas Replay</p>
            <h2 id="phaseLabel">初始化</h2>
          </div>
          <div id="cellReadout" class="cell-readout">悬停查看格子</div>
        </div>
        <div class="canvas-frame">
          <canvas id="mazeCanvas" width="960" height="960" aria-label="迷宫可视化画布"></canvas>
        </div>
      </section>

      <aside class="panel insight-panel" aria-label="状态详情">
        <section class="insight-section">
          <div class="section-title">当前格子</div>
          <dl class="detail-grid">
            <div>
              <dt>坐标</dt>
              <dd id="tileCoord">-</dd>
            </div>
            <div>
              <dt>类型</dt>
              <dd id="tileType">-</dd>
            </div>
            <div>
              <dt>权重</dt>
              <dd id="tileWeight">-</dd>
            </div>
          </dl>
        </section>

        <section class="insight-section">
          <div class="section-title">图例</div>
          <div class="legend-grid" id="legendGrid"></div>
        </section>

        <section class="insight-section grow">
          <div class="section-title">事件流</div>
          <ol id="eventList" class="event-list"></ol>
        </section>
      </aside>
    </main>

    <script src="./app.js?v=20260526-local" defer></script>
  </body>
</html>
