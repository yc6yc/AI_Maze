<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Maze Static Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="workspace">
        <header class="demo-topbar">
          <div>
            <h1>AI Maze</h1>
            <p id="mapName">sample.json</p>
          </div>
          <div class="demo-actions">
            <button id="loadSampleBtn">加载样例</button>
            <label class="file-btn">
              导入地图
              <input id="fileInput" type="file" accept="application/json" />
            </label>
            <button id="runBtn">模拟</button>
            <button id="playBtn">播放</button>
          </div>
        </header>
        <div class="stage">
          <canvas id="mazeCanvas"></canvas>
          <div id="bossLayer" class="boss-layer hidden">
            <iframe src="boss.html?embed=1" title="Boss battle"></iframe>
          </div>
        </div>
      </section>

      <aside class="dashboard">
        <div class="metric-row">
          <span>步数</span>
          <strong id="stepsText">0</strong>
        </div>
        <div class="metric-row">
          <span>价值</span>
          <strong id="coinsText">0</strong>
        </div>
        <div class="metric-row">
          <span>评分</span>
          <strong id="scoreText">0.00</strong>
        </div>
        <div class="metric-row">
          <span>状态</span>
          <strong id="phaseText">ready</strong>
        </div>
        <ol id="eventList" class="event-stream"></ol>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
